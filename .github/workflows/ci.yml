# Managed by dev-kit (.shared/bin/kit init). Do not edit: the checks live in
# .shared/ci/action.yml and run at the dev-kit version this repository pins.
# Project-specific jobs (tests, builds) go in a separate workflow file.
#
# The job name `checks` is the required status check of the main ruleset; it runs on
# every pull request with no path filter, so it always reports.
name: CI

on:
  pull_request:
    # edited: a fixed title or body reruns the pull request gate (dev-kit#21)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read          # the design approval gate reads the PR's issue (dev-kit#26)
  pull-requests: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.shared/ci
